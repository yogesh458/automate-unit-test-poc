spring.application.name=employee-crud

# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee_crud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# JWT configuration
security.jwt.secret=change-this-secret-to-a-secure-256-bit-value-for-production
security.jwt.expiration-ms=86400000

# Default in-memory admin user for authentication
security.admin.username=admin
security.admin.password=admin123
