name: Copilot Test - EmployeeServiceImpl only

# Fires automatically the moment you push to this branch (any branch except main).
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}   # also lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

jobs:
  copilot-generate-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (for Copilot CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install/Update GitHub Copilot CLI
        run: npm install -g @github/copilot && copilot update || true

      - name: Locate EmployeeServiceImpl.java
        id: locate
        run: |
          FILE=$(find src/main/java -name "EmployeeServiceImpl.java" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "EmployeeServiceImpl.java not found in src/main/java — check the path/class name."
            exit 1
          fi
          echo "Found: $FILE"
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Generate/update test with Copilot CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "This is a Spring Boot project (group com.volane, project employee-crud). Look at ${{ steps.locate.outputs.file }}. Generate or update its JUnit 5 test class under src/test/java, mirroring the same package path, named EmployeeServiceImplTest. Cover: happy path for each public method, null/invalid input, and not-found case. Tag basic CRUD create/read tests with @Tag(\"smoke\"). Write the file directly to disk, do not just print code." \
            --allow-all-tools --allow-all-paths

      - name: Commit generated test
        run: |
          git config user.name "copilot-bot"
          git config user.email "copilot-bot@users.noreply.github.com"
          git add src/test/java
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: Copilot-generated test for EmployeeServiceImpl [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

  smoke-test:
    needs: copilot-generate-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest (including Copilot-generated test)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run smoke-tagged tests
        run: mvn test -Psmoke

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: target/surefire-reports/